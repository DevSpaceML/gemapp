build-scan-image:
    name: build-scan
    needs: resolve-vars
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: build-${{ needs.resolve-vars.outputs.app }}-${{ needs.resolve-vars.outputs.env }}
      cancel-in-progress: ${{ needs.resolve-vars.outputs.env == 'dev' }}
    env:
      APP: ${{ needs.resolve-vars.outputs.app }}
      TARGET_ENV: ${{ needs.resolve-vars.outputs.env }}
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::4433557766221:role/gha_deploy
          role-session-name: GitHub-Actions-OIDC-Session
          aws-region: us-east-1
          mask-aws-account-id: false

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3    

      - name: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: gemapp:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          platforms: linux/arm64
          push: false

      - run: docker load -i /tmp/image.tar

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gemapp:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Trivy Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gemapp:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yml    

      - name: Upload Trivy report    
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: image upload
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1