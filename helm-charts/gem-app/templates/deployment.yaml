apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gemapp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gemmapp.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- with Values.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
    {{- include "gemapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml" ) . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "gemmapp.selectorLabels" . | nindent 8 }}
        {{- with .Values.labels}}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ServiceAccountName: {{ include "gemapp.serviceAccountName" }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
          - name: HTTP
            containerPort: {{ .Values.service.targetPort }}
            protocol: TCP
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 10 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 10 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 10 }}
          env:
          {{- range .Values.env}}
          - name: {{ .name }}
            value: {{ .value | quote }}
          {{- end }} 
          {{- if .Values.envFrom }}
          envFrom:
          {{- toYaml .Values.envFrom | nindent 8 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
          - name: data
            mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          {{- if .Values.configmap.enabled }}
          - name: config
            mountPath: /config
            readOnly: true
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.configMap.enabled }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "gemapp.fullname" . }}
      {{- end }}
      {{- if .Values.configMap.enabled }}
      - name: config
        configMap:
          name: {{ include "gemapp.fullname" }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}  

        


        




            
             
            






              
          
        

        

          




       



