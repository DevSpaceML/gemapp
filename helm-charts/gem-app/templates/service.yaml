apiVersion: v1
kind: Service
metadata:
  name: {{ include "gemapp.fullname" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{ include "gemapp.labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "gemapp.selectorLabels" . | nindent 4 }}