name: deploy_app

on:
  push:
    branches:
      - dev
      - staging
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environments:
        description: 'Image to push'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      image-tag:
        description: 'Image tag (leave empty for auto-generation)'
        required: false
        type: string
env:
  AWS_REGION: us-east-1
  APP_NAME: gemapp

jobs:
  DeployAppToEnv:
    name: deploy_app
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'dev' || github.ref_name == 'staging' }}
    environment:
      name: ${{ github.ref_name }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Terraform Outputs
        id: terraform
        run: |
          cd /opt/homebrew/var/deploy/infrastructure/environments/dev
          terraform init
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          CERT_ARN=$(terraform output -raw cert_arn)
          ALB_SG_ID=$(terraform output -raw alb_security_group_id)
          SUBNETS=$(terraform output -json public_subnet_ids | jq -r  'join(",")')

          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "cert_arn=$CERT_ARN" >> $GITHUB_OUTPUT
          echo "alb_sg_id=$ALB_SG_ID" >> $GITHUB_OUTPUT
          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT

      - name: Update KubeConfig
        run: |
          aws eks update-kubeconfig --name ${{ steps.terraform.outputs.cluster_name }}
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run Helm-App-Deployment
        run: |
          helm upgrade --install gemapp /helm-charts/gemapp \
            --namespace ${{ env.APP_NAME }}-${{ github.ref_name }} \
            --create-namespace \
            --values /helm-charts/gemapp/values-${{ github.ref_name }}.yaml \
            --set image.tag=${{ github.sha }}
            --set ingress.annotations."alb\.ingress\.kubernetes\.io/certificate-arn"="{{ steps.terraform.outputs.cert-arn }}"
            --set ingress.annotations."alb\.ingress\.kubernetes\.io/security-groups"="{{ steps.terraform.outputs.alb-sg-id }}"
            --set ingress.annotations."alb\.ingress\.kubernetes\.io/subnets"="{{ steps.terraform.outputs.subnets }}"
            --set service.annotations."alb\.ingress\.kubernetes\.io/certificate-arn"="{{ steps.terraform.outputs.cert-arn }}"



