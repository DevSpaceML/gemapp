---
name: Build Image-Push to ECR

on:
  push:
    tags:
      - 'latest'
  workflow_dispatch:
    inputs:
      environments:
        description: 'Image to push'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      image-tag:
        description: 'Image tag (leave empty for auto-generation)'
        required: false
        type: string
env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 586098609239.dkr.ecr.us-east-1.amazonaws.com

jobs:
  conditional-build-and-push:
    name: Build-Push-On-Change
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    outputs:
      image-tag: ${{ steps.generate-tag.outputs.image-tag }}
      image-uri: ${{ steps.generate-tag.outputs.image-uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Image Tag
        id: generate-tag
        run: |
          if ["${{ github.event_name }}" = "workflow_dispatch"] && [ -n "${{ inputs.image-tag }}"]; then
            IMAGE_TAG="${{ inputs.image-tag }}"
            ENVIRONMENT="${{ inputs.environments }}"
          else
            #Auto-Generate tag based on commit
            if [ "${{ github.ref_name }}" = "dev" ]; then
              ENVIRONMENT="dev"
              IMAGE_TAG="dev-$(git rev-parse --short HEAD)-$(date +%Y%m%d-%H%M)"
            elif [ "${{ github.ref_name }}" = "staging" ]; then
              ENVIRONMENT="staging"
              IMAGE_TAG="staging-$(git rev-parse --short HEAD)-$(date +%Y%m%d-%H%M)"
            elif [ "${{ github.ref_name }}" = "main" ]; then
              ENVIRONMENT="production"
              IMAGE_TAG="v$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
            else
              ENVIROINMENT="dev"
              IMAGE_TAG="latest"  
            fi
          fi
          
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image-uri=${{ env.ECR_REGISTRY }}/dev/gemapp:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "selected environment: $ENVIRONMENT"
          echo "generated image tag : $IMAGE_TAG"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::586098609239:role/GitHubActionsRole
          aws-region: us-east-1

      - name: log in to AmazonECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          IMAGE_URI="${{ steps.generate-tag.outputs.image-uri }}"
          echo "Building image: $IMAGE_URI"
          docker build -t $IMAGE_URI .

      - name: Push image to ECR
        run: |
          IMAGE_URI="${{ steps.generate-tag.outputs.image-uri }}"
          docker push $IMAGE_URI
