# Build and Push ECR Image
name: build-and-push-image
on:
  push:
    branches: [dev,main]
    paths:
      - '/Library/webserver/documents/**'

jobs:
  resolve-vars:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.vars.outputs.app }}
      env: ${{ steps.vars.outputs.env }}
    steps:
      - id: vars
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_ENV: ${{ inputs.env }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [[ "$EVENT" = "workflow_dispatch" ]]; then
            APP="${$INPUT_APP:-$REPO}"
            ENV="${INPUT_ENV}"
          else
            APP="$REPO"
            case "$BRANCH" in
              dev) ENV=dev ;;
              staging) ENV=staging ;;
              *) echo "No mapped environment for branch $BRANCH"; exit 1;;
          fi
          [[ "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "Invalid app name"; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "env=$ENV" >> "$GITHUB_OUTPUT

  build-scan-image:
    name: build-scan
    needs: resolve-vars
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-vars.outputs.env }}
    concurrency:
      group: build-${{ needs.resolve-vars.outputs.app }}-${{ needs.resolve-vars.outputs.env }}
      cancel-in-progress: ${{ needs.resolve.outputs.env == 'dev' }}
    env:
      AWS_REGION: 'us-east-1'
      APP: ${{ needs.resolve-vars.outputs.app }}
      TARGET_ENV: ${{ needs.resolve-vars.outputs.env }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        name: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::488347380548:role/gha_deploy
          aws-region: 'us-east-1'

      - uses: docker/setup-buildx-action@v3
        name: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: gemapp:{{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          platforms: linux/arm64

      - run: docker load -i /tmp/image.tar

      - name: Trivy Report
        uses: acquasecurity/trivy-action@0.28.0
        with:
          image-ref: gemapp:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif-file: trivy.sarif

      - name: Trivy Gate
        uses: acquasecurity/trivy-action@0.28.0
        with:
          image-ref: gemapp:${{ github.sha }}
          severity: CRITICAL, HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: trivyignore.yml

      - uses: actions/upload-artifact@v4
        name: image
        path: /tmp/image.tar
        retention-days: 1

  push-to-ecr:
    needs: build-scan-image
    environment: ${{ needs.resolve-vars.outputs.env}}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - run: docker load -i /tmp/image.tar

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::488347380548:role/gha_deploy
          aws-region: ${{ env.region }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push
        run: | 
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.repo }}:${{ github.sha }}
          docker tag ${{ env.app }}:${{ github.sha }} $IMAGE
          docker push $IMAGE

