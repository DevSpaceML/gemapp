# Build and Push ECR Image
name: build-and-push-image
on:
  push:
    branches: [dev,main]
    paths-ignore:
      - '.github/workflows/**'
      - 'helm-charts/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      app:
        description: App name (defaults to repo name)
        required: false
      env:
        description: Target environment
        required: true
        type: choice
        options: [dev,staging, prod]

permissions:
  contents: read
env:
  AWS_REGION: us-east-1

jobs:
  resolve-vars:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.vars.outputs.app }}
      env: ${{ steps.vars.outputs.env }}
    steps:
      - id: vars
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_ENV: ${{ inputs.env }}
          REPO: ${{ github.event.repository.name }}
        run: |
          if [[ "$EVENT" = "workflow_dispatch" ]]; then
            APP="${INPUT_APP:-$REPO}"
            ENV="${INPUT_ENV}"
          else
            APP="$REPO"
            case "$BRANCH" in
              dev) ENV=dev ;;
              main) ENV=main ;;
              *) echo "No mapped environment for branch $BRANCH"; exit 1;;
            esac
          fi
          [[ "$APP" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "Invalid app name"; exit 1; }
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "env=$ENV" >> "$GITHUB_OUTPUT"

  build-scan-image:
    name: build-scan
    needs: resolve-vars
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: build-${{ needs.resolve-vars.outputs.app }}-${{ needs.resolve-vars.outputs.env }}
      cancel-in-progress: ${{ needs.resolve-vars.outputs.env == 'dev' }}
    env:
      APP: ${{ needs.resolve-vars.outputs.app }}
      TARGET_ENV: ${{ needs.resolve-vars.outputs.env }}
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::488347380548:role/gha_deploy
          role-session-name: GitHub-Actions-OIDC-Session
          aws-region: us-east-1
          mask-aws-account-id: false

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3    

      - name: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: gemapp:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          platforms: linux/arm64
          push: false

      - run: docker load -i /tmp/image.tar

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gemapp:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Trivy Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gemapp:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yml    

      - name: Upload Trivy report    
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: image upload
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  push-to-ecr:
    needs: [resolve-vars,build-scan-image]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-vars.outputs.env}}
    env:
      app: ${{ needs.resolve-vars.outputs.app }}
      target_repo: ${{ needs.resolve-vars.outputs.env }}-${{ needs.resolve-vars.outputs.app }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Image artifact
        uses: actions/download-artifact@v4
        with:
          name: image
          path: /tmp

      - run: docker load -i /tmp/image.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::488347380548:role/gha_deploy
          role-session-name: GitHub-Actions-OIDC-Session
          aws-region: us-east-1
          mask-aws-account-id: false

      - name: Login to AWS ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push
        run: | 
          IMAGE=${{ steps.ecr.outputs.registry }}/${{ env.target_repo }}:${{ github.sha }}
          docker tag ${{ env.app }}:${{ github.sha }} $IMAGE
          docker push $IMAGE

