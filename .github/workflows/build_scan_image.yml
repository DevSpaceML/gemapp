# Build and Scan ECR Image
name: build-scan-image
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [dev, staging]
  push:
    branches: [dev, staging]  
    paths-ignore:
      - '.github/workflows/**'
      - 'helm-charts/**'
      - 'scripts/**' 
permissions:
  contents: read
concurrency:
  group: build-scan-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  
jobs:
  build-scan-image:
    name: build-scan
    runs-on: ubuntu-24.04-arm
    env:
      APP: ${{ github.event.repository.name }}
      TAG: ${{ github.event.pull_request.number && format ('pr-{0}', github.event.pull_request.number) || github.sha }}
    permissions:
      id-token: write
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3    

      - name: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ env.APP }}:${{ env.TAG }}
          outputs: type=docker,dest=/tmp/image.tar
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max 
          push: false

      - name: Load Image
        run: docker load -i /tmp/image.tar

      - name: Scan Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.APP }}:${{ env.TAG }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Trivy Gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.APP }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yml    

      - name: Upload Trivy report    
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Upload Image Artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 1

  publish:
    needs: build-scan
    if: github.event_name == 'push'
    uses: ./.github/workflows/push_ecr_image.yml
    permissions:
      id-token: write
      contents: read
    with:
      app: ${{ github.event.repository.name }}
      environment: ${{ github.ref_name }}
      image-tag: ${{ github.sha }}


